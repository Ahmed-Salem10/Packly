[project]
name = "packly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed", email = "ahmedwsalem01@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "pydentic>=0.0.1.dev3",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
]

[project.scripts]
packly = "packly:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
