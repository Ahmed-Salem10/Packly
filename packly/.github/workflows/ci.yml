
# .github/workflows/ci.yml

name: Packly CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./packly

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: packly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d packly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:ci_password@localhost:5432/packly
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-jwt-secret
      OTP_SECRET_KEY: ci-otp-secret


    steps:
      # 1. Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install uv
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      # 3. Install Python 3.13
      - name: Setup Python
        run: uv python install 3.13

      # 4. Install dependencies
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # 5. Check code quality
      - name: Ruff Lint
        run: uv run ruff check src/

      # 6. Check formatting
      - name: Ruff Format
        run: uv run ruff format --check src/

      # 7. Static type checking
      - name: Mypy
        run: uv run mypy src/packly/

      # 8. Apply migrations (also validates them)
      - name: Alembic upgrade
        run: uv run alembic upgrade head

      # 9. Run tests
      - name: Pytest
        run: uv run pytest -q
