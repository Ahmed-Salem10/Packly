
# .github/workflows/ci.yml

name: Packly CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./packly


    steps:
      # 1. Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install uv
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      # 3. Install Python 3.13
      - name: Setup Python
        run: uv python install 3.13

      # 4. Install dependencies
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # 5. Check code quality
      - name: Ruff Lint
        run: uv run ruff check src/

      # 6. Check formatting
      - name: Ruff Format
        run: uv run ruff format --check src/

      # 7. Static type checking
      - name: Mypy
        run: uv run mypy src/packly/

      # 8. Run tests
      - name: Pytest
        run: uv run pytest -q
